[package]
name = "data-vent"
version = "0.2.0"
edition = "2021"
description = "Intelligent retrieval engine - semantic search and graph queries"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
axum = "0.7.5"
tonic = "0.11.0"
prost = "0.12.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.4", features = ["json"] }
redis = { version = "0.25.3", features = ["tokio-comp"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2.3"
dotenvy = "0.15.7"
envconfig = "0.10.0"
anyhow = "1.0.82"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
futures = "0.3.30"
regex = "1.10.4"
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["cors", "trace"] }

[build-dependencies]
tonic-build = "0.11.0"
