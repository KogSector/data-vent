[project]
name = "data-vent"
version = "0.1.0"
description = "Intelligent retrieval engine — semantic search and graph queries"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
    "uuid>=1.30",
    # gRPC for distributed pipeline
    "grpcio>=1.81.1",
    "grpcio-tools>=1.81.1",
    "grpcio-reflection>=1.81.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"
