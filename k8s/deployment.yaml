apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-vent
  namespace: confuse
  labels:
    app: data-vent
    service: export
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-vent
  template:
    metadata:
      labels:
        app: data-vent
        service: export
        version: v1.0.0
    spec:
      containers:
      - name: data-vent
        image: confuseimgr.azurecr.io/data-vent:v1.0.0
        ports:
        - containerPort: 3040
          name: http
        env:
        # Service Configuration
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: PORT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: HOST
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: ENVIRONMENT
        
        # Database Configuration (from shared infrastructure)
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-infrastructure
              key: postgres_host
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-infrastructure
              key: postgres_port
        - name: POSTGRES_DATABASE
          valueFrom:
            configMapKeyRef:
              name: shared-infrastructure
              key: postgres_database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: shared-infrastructure-secrets
              key: postgres_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-infrastructure-secrets
              key: postgres_password
        - name: POSTGRES_SSL_MODE
          valueFrom:
            configMapKeyRef:
              name: shared-infrastructure
              key: postgres_ssl_mode
        
        # FalkorDB Configuration (from shared infrastructure)
        - name: FALKORDB_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-infrastructure
              key: falkordb_host
        - name: FALKORDB_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-infrastructure
              key: falkordb_port
        - name: FALKORDB_GRAPH_NAME
          valueFrom:
            configMapKeyRef:
              name: shared-infrastructure
              key: falkordb_graph_name
        - name: FALKORDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-infrastructure-secrets
              key: falkordb_password
        
        # Service Dependencies
        - name: AUTH_MIDDLEWARE_URL
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: AUTH_MIDDLEWARE_URL
        
        # CORS Configuration
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: CORS_ORIGINS
        
        # Export Configuration
        - name: MAX_EXPORT_SIZE_MB
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: MAX_EXPORT_SIZE_MB
        - name: EXPORT_FORMATS
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: EXPORT_FORMATS
        
        # Logging
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: data-vent-config
              key: LOG_LEVEL
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3040
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 3040
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      imagePullSecrets:
      - name: acr-secret
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
