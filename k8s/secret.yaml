apiVersion: v1
kind: Secret
metadata:
  name: data-vent-secrets
  namespace: confuse
type: Opaque
stringData:
  # Service Secrets
  SERVICE_API_KEY: "data_vent_api_key_here"
  EXPORT_SECRET_KEY: "export_secret_key_here"
  
  # External Service Keys (if needed)
  AWS_ACCESS_KEY_ID: "aws_access_key_here"
  AWS_SECRET_ACCESS_KEY: "aws_secret_key_here"
  AWS_S3_BUCKET: "confuse-exports"
  
  # Encryption Keys
  ENCRYPTION_KEY: "32-byte-encryption-key-for-data-vent"
  
  # Database Secrets (if different from shared)
  # DATABASE_PASSWORD: "override_password_here"
