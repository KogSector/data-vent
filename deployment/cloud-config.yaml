apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-vent
  labels:
    app: data-vent
    tier: retrieval-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-vent
  template:
    metadata:
      labels:
        app: data-vent
    spec:
      containers:
        - name: data-vent
          image: data-vent:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: DATA_VENT_PORT
              value: "3002"
            - name: HOST
              value: "0.0.0.0"
            - name: FALKORDB_HOST
              valueFrom:
                secretKeyRef:
                  name: falkordb-secret
                  key: host
            - name: FALKORDB_PORT
              value: "6379"
            - name: FALKORDB_GRAPH_NAME
              value: "confuse_graph"
            - name: NVIDIA_NIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nvidia-secret
                  key: api_key
            - name: HNSW_MODE
              value: "balanced"
            - name: ENABLE_PARALLEL_ALGORITHMS
              value: "true"
            - name: ENABLE_CACHE_WARMING
              value: "true"
            - name: TARGET_CACHE_HIT_RATE
              value: "0.6"
            - name: MAX_LATENCY_MS
              value: "100.0"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: data-vent-service
spec:
  selector:
    app: data-vent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3002
  type: ClusterIP
